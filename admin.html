<!DOCTYPE html>
<html lang="he" dir="rtl" data-theme="neural">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SLH Admin | Backoffice</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" type="image/png" href="/favicon-32.png">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/shared.css?v=20260426e">
    <link rel="stylesheet" href="/css/slh-neural.css?v=20260427a">
    <style>
        :root{--bg:#0a0a0a;--bg2:#111;--bg3:#1a1a1a;--accent:#00ff41;--accent2:#39ff14;--cyan:#00e5ff;--gold:#ffd700;--red:#ff0055;--purple:#a855f7;--text:#00ff41;--text2:#008f11;--text-bright:#39ff14;--card:rgba(0,255,65,.03);--border:rgba(0,255,65,.12);--font:'Space Mono','Courier New',monospace;--radius:0px;--shadow:0 0 20px rgba(0,255,65,.05)}
        /* Theme overrides — controlled by FAB */
        [data-theme="dark"]{--bg:#0b0e16;--bg2:#111628;--bg3:#1a2038;--accent:#00b4d8;--accent2:#90e0ef;--cyan:#00e5ff;--gold:#ffd700;--red:#ef4444;--purple:#a855f7;--text:#e8e8f0;--text2:#8a8aa0;--text-bright:#ffffff;--card:rgba(0,180,216,.04);--border:rgba(0,180,216,.2);--font:'Inter',system-ui,sans-serif;--radius:8px;--shadow:0 4px 16px rgba(0,0,0,.4)}
        [data-theme="light"]{--bg:#f8f9fb;--bg2:#ffffff;--bg3:#f0f2f7;--accent:#0066cc;--accent2:#0052a3;--cyan:#0077aa;--gold:#b8860b;--red:#c53030;--purple:#7c3aed;--text:#1a1a1a;--text2:#555;--text-bright:#000;--card:rgba(0,102,204,.04);--border:rgba(0,102,204,.2);--font:'Inter',system-ui,sans-serif;--radius:8px;--shadow:0 2px 8px rgba(0,0,0,.08)}
        [data-theme="crypto"]{--bg:#0d1117;--bg2:#161b22;--bg3:#21262d;--accent:#f7931a;--accent2:#ffb14e;--cyan:#00d4ff;--gold:#ffd700;--red:#ef4444;--purple:#a855f7;--text:#e8e8f0;--text2:#8a8aa0;--text-bright:#fff;--card:rgba(247,147,26,.04);--border:rgba(247,147,26,.2);--font:'Inter',system-ui,sans-serif;--radius:8px;--shadow:0 4px 16px rgba(0,0,0,.4)}
        [data-theme="cyberpunk"]{--bg:#0a0014;--bg2:#14001f;--bg3:#1f0029;--accent:#ff00ff;--accent2:#00ffff;--cyan:#00ffff;--gold:#ffff00;--red:#ff0080;--purple:#8000ff;--text:#ff00ff;--text2:#cc00cc;--text-bright:#fff;--card:rgba(255,0,255,.05);--border:rgba(255,0,255,.3);--font:'Space Mono',monospace;--radius:0;--shadow:0 0 20px rgba(255,0,255,.2)}
        [data-theme="ocean"]{--bg:#001e3c;--bg2:#002c55;--bg3:#003a6e;--accent:#00d9ff;--accent2:#0099cc;--cyan:#00d9ff;--gold:#ffd700;--red:#ef4444;--purple:#a855f7;--text:#b8e6ff;--text2:#6bb6cc;--text-bright:#fff;--card:rgba(0,217,255,.04);--border:rgba(0,217,255,.2);--font:'Inter',system-ui,sans-serif;--radius:8px;--shadow:0 4px 16px rgba(0,0,0,.4)}
        [data-theme="sunset"]{--bg:#1a0a14;--bg2:#251018;--bg3:#30161f;--accent:#ff6b6b;--accent2:#ffa07a;--cyan:#ffd93d;--gold:#ffb703;--red:#c53030;--purple:#a855f7;--text:#ffe5d9;--text2:#c9a88a;--text-bright:#fff;--card:rgba(255,107,107,.04);--border:rgba(255,107,107,.2);--font:'Inter',system-ui,sans-serif;--radius:8px;--shadow:0 4px 16px rgba(0,0,0,.4)}
        /* Hide CRT scan lines in non-terminal themes */
        [data-theme] body::after{display:none !important}
        /* Theme FAB — positioned above the AI FAB to avoid overlap.
           AI FAB is at bottom:24px; left:24px; size 58px, so we sit at bottom:94px. */
        #theme-fab{position:fixed;bottom:94px;left:24px;z-index:99997;background:var(--accent);color:#000;width:48px;height:48px;border-radius:50%;border:none;cursor:pointer;font-size:20px;box-shadow:0 4px 16px rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;transition:transform .2s}
        #theme-fab:hover{transform:scale(1.1)}
        #theme-panel{position:fixed;bottom:150px;left:24px;z-index:99998;background:var(--bg2);border:1px solid var(--border);padding:16px;border-radius:12px;display:none;flex-direction:column;gap:6px;min-width:220px;box-shadow:0 10px 30px rgba(0,0,0,.6)}
        #theme-panel.open{display:flex}
        #theme-panel .title{font-size:11px;color:var(--text2);text-transform:uppercase;letter-spacing:1.5px;margin-bottom:6px;font-family:'Inter',sans-serif}
        #theme-panel button{background:var(--bg);border:1px solid var(--border);color:var(--text);padding:10px 14px;cursor:pointer;font-size:12px;text-align:right;font-family:inherit;border-radius:6px;transition:all .2s}
        #theme-panel button:hover{background:var(--accent);color:#000;transform:translateX(-4px)}
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh}
        body::after{content:'';position:fixed;inset:0;background:repeating-linear-gradient(0deg,rgba(0,0,0,.03) 0px,rgba(0,0,0,.03) 1px,transparent 1px,transparent 3px);pointer-events:none;z-index:9999}
        a{color:var(--accent);text-decoration:none}
        button{cursor:pointer;font-family:var(--font)}

        /* Auth Gate */
        .auth-box{background:var(--bg2);border:1px solid var(--border);padding:40px;text-align:center;max-width:400px;width:90%}
        .auth-box h2{font-size:20px;margin-bottom:8px;color:var(--accent)}
        .auth-box p{font-size:12px;color:var(--text2);margin-bottom:24px}
        .auth-box input{width:100%;padding:12px;background:var(--bg);border:1px solid var(--border);color:var(--text);font-family:var(--font);font-size:14px;margin-bottom:16px;text-align:center}
        .auth-box button{width:100%;padding:12px;background:var(--accent);color:#000;font-weight:700;border:none;font-size:14px}
        .auth-box button:hover{background:var(--accent2)}
        .auth-err{color:var(--red);font-size:11px;margin-top:8px;display:none}

        /* Layout */
        .admin-nav{position:sticky;top:0;z-index:100;padding:12px 24px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;background:var(--bg2)}
        .nav-brand{font-weight:700;font-size:15px;color:var(--accent)}
        .nav-brand span{color:var(--red);font-size:10px;margin-right:8px;border:1px solid var(--red);padding:2px 6px}
        .nav-links{display:flex;gap:16px;font-size:12px}
        .nav-links a{color:var(--text2);padding:4px 8px;border:1px solid transparent}
        .nav-links a:hover,.nav-links a.active{color:var(--accent);border-color:var(--accent)}
        .nav-actions{display:flex;gap:12px;align-items:center;font-size:11px}

        .admin-body{display:flex;min-height:calc(100vh - 50px)}
        .admin-sidebar{width:220px;background:var(--bg2);border-left:1px solid var(--border);padding:16px 0;flex-shrink:0}
        .admin-sidebar .sb-section{padding:8px 16px;font-size:9px;text-transform:uppercase;letter-spacing:2px;color:var(--text2);opacity:.6;margin-top:12px}
        .admin-sidebar a{display:flex;align-items:center;gap:8px;padding:10px 16px;font-size:12px;color:var(--text2);border-right:2px solid transparent;transition:all .2s}
        .admin-sidebar a:hover,.admin-sidebar a.active{color:var(--accent);background:var(--card);border-right-color:var(--accent)}
        .admin-main{flex:1;padding:24px;overflow-y:auto}

        /* KPI cards */
        .kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px;margin-bottom:24px}
        .kpi{background:var(--bg2);border:1px solid var(--border);padding:20px;position:relative;overflow:hidden}
        .kpi::before{content:'';position:absolute;top:0;right:0;width:3px;height:100%}
        .kpi.green::before{background:var(--accent)}
        .kpi.cyan::before{background:var(--cyan)}
        .kpi.gold::before{background:var(--gold)}
        .kpi.red::before{background:var(--red)}
        .kpi.purple::before{background:var(--purple)}
        .kpi-label{font-size:10px;color:var(--text2);text-transform:uppercase;letter-spacing:1px;margin-bottom:8px}
        .kpi-value{font-size:28px;font-weight:700;color:var(--text-bright)}
        .kpi-delta{font-size:11px;margin-top:4px}
        .kpi-delta.up{color:var(--accent)}
        .kpi-delta.down{color:var(--red)}

        /* Section */
        .admin-section{background:var(--bg2);border:1px solid var(--border);padding:20px;margin-bottom:24px}
        .admin-section h3{font-size:14px;color:var(--accent);margin-bottom:16px;padding-bottom:8px;border-bottom:1px solid var(--border)}
        .admin-section h3 span{font-size:10px;color:var(--text2);margin-right:8px}

        /* Charts */
        .chart-grid{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-bottom:24px}
        .chart-box{background:var(--bg2);border:1px solid var(--border);padding:20px}
        .chart-box h4{font-size:12px;color:var(--accent);margin-bottom:12px}
        .chart-box canvas{max-height:250px}

        /* Tables */
        .admin-table{width:100%;border-collapse:collapse;font-size:12px}
        .admin-table th{text-align:right;padding:10px 12px;background:var(--bg3);color:var(--text2);font-size:10px;text-transform:uppercase;letter-spacing:1px;border-bottom:1px solid var(--border)}
        .admin-table td{padding:10px 12px;border-bottom:1px solid var(--border)}
        .admin-table tr:hover td{background:var(--card)}
        .badge{display:inline-block;padding:2px 8px;font-size:10px;font-weight:700;border-radius:2px}
        .badge.live{background:rgba(0,255,65,.15);color:var(--accent)}
        .badge.pending{background:rgba(255,215,0,.15);color:var(--gold)}
        .badge.error{background:rgba(255,0,85,.15);color:var(--red)}

        /* Activity feed */
        .activity-feed{max-height:400px;overflow-y:auto}
        .activity-item{padding:10px 0;border-bottom:1px solid var(--border);font-size:12px;display:flex;gap:10px;align-items:flex-start}
        .activity-icon{width:28px;height:28px;display:flex;align-items:center;justify-content:center;background:var(--card);border:1px solid var(--border);flex-shrink:0;font-size:14px}
        .activity-text{flex:1}
        .activity-time{font-size:10px;color:var(--text2);flex-shrink:0}

        /* Responsive */
        @media(max-width:768px){
            .admin-sidebar{display:none}
            .chart-grid{grid-template-columns:1fr}
            .kpi-grid{grid-template-columns:repeat(2,1fr)}
        }
    </style>
</head>
<body>
<div class="neural-bg" aria-hidden="true"></div>

<div id="topnav-root"></div>
<div id="ticker-root"></div>
