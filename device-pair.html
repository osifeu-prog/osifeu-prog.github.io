<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SLH · קישור מכשיר</title>
<link rel="stylesheet" href="/css/style.css">
<style>
  body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: #0b1020; color: #e9ecf2; max-width: 520px; margin: 0 auto; padding: 24px 16px; }
  h1 { color: #7ab4ff; font-size: 22px; margin: 0 0 16px; }
  .card { background: #12182f; border: 1px solid #223058; border-radius: 12px; padding: 18px; margin-bottom: 14px; }
  label { display: block; margin-bottom: 6px; color: #9db0d4; font-size: 14px; }
  input, button { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #334071; background: #0e1428; color: #fff; font-size: 16px; box-sizing: border-box; }
  button { background: linear-gradient(135deg, #3769b7, #4a89d1); border: none; font-weight: 600; cursor: pointer; margin-top: 8px; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  .muted { color: #8a98bf; font-size: 13px; }
  .ok { color: #4ade80; }
  .err { color: #f87171; }
  .step { display: none; }
  .step.active { display: block; }
  code { background: #0a0e1e; padding: 2px 6px; border-radius: 4px; font-size: 13px; }
  .mac { font-family: monospace; color: #ffd27a; }
</style>
</head>
<body>
<h1>📟 קישור מכשיר SLH</h1>

<div class="card">
  <div class="muted">מכשיר: <span class="mac" id="mac">(טוען…)</span></div>
  <div class="muted" id="status">מוכן לקישור</div>
</div>

<section class="step active" id="step-phone">
  <div class="card">
    <label for="phone">טלפון לקבלת קוד (Telegram או SMS)</label>
    <input type="tel" id="phone" placeholder="0501234567" autocomplete="tel">
    <button id="btn-send-code">📩 שלח קוד</button>
    <div class="muted" style="margin-top:10px">הקוד יישלח לטלגרם אם הטלפון מקושר, אחרת כ-SMS.</div>
  </div>
</section>

<section class="step" id="step-code">
  <div class="card">
    <label for="code">קוד אימות (6 ספרות)</label>
    <input type="text" id="code" inputmode="numeric" maxlength="6" placeholder="123456">
    <button id="btn-verify">✅ אמת וקשר מכשיר</button>
    <div class="muted" style="margin-top:10px">הקוד תקף ל-5 דקות.</div>
  </div>
</section>

<section class="step" id="step-done">
  <div class="card">
    <h2 style="color:#4ade80; margin:0 0 10px">✅ המכשיר קושר בהצלחה!</h2>
    <div class="muted">User ID: <span id="out-uid">?</span></div>
    <div class="muted" style="margin-top:8px">המכשיר אמור לתפוס את הקישור תוך 5 שניות ולעבור להציג את היתרה.</div>
    <button onclick="location.href='/wallet.html'" style="margin-top:16px">👛 לארנק שלי</button>
  </div>
</section>

<script>
const API = "https://slh-api-production.up.railway.app";

function qs(k) {
  return new URLSearchParams(location.search).get(k);
}

function setStep(id) {
  document.querySelectorAll('.step').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function setStatus(msg, cls) {
  const el = document.getElementById('status');
  el.textContent = msg;
  el.className = cls ? ('muted ' + cls) : 'muted';
}

const rawMac = (qs('mac') || '').toUpperCase().replace(/[^A-F0-9]/g, '');
const deviceId = rawMac ? `esp32-${rawMac}` : '';
document.getElementById('mac').textContent = rawMac || '(חסר MAC בכתובת)';

if (!rawMac) {
  setStatus('⚠️ פתח את הדף ע"י סריקת ה-QR מהמכשיר.', 'err');
  document.getElementById('btn-send-code').disabled = true;
}

document.getElementById('btn-send-code').addEventListener('click', async () => {
  const phone = document.getElementById('phone').value.trim();
  if (!phone || phone.length < 9) {
    setStatus('מספר טלפון לא תקין', 'err');
    return;
  }
  setStatus('שולח קוד…');
  try {
    const r = await fetch(`${API}/api/device/register`, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({phone, device_id: deviceId, device_type: 'esp32'}),
    });
    const data = await r.json();
    if (!r.ok) {
      setStatus('שגיאה: ' + (data.detail || r.statusText), 'err');
      return;
    }
    setStatus(data.delivery === 'telegram' ? '✉️ קוד נשלח לטלגרם' : '📱 קוד נשלח ב-SMS', 'ok');
    setStep('step-code');
    if (data._dev_code) {
      // Dev helper: pre-fill code if SMS isn't configured
      document.getElementById('code').value = data._dev_code;
    }
  } catch (e) {
    setStatus('שגיאת רשת: ' + e.message, 'err');
  }
});

document.getElementById('btn-verify').addEventListener('click', async () => {
  const phone = document.getElementById('phone').value.trim();
  const code = document.getElementById('code').value.trim();
  if (!/^\d{6}$/.test(code)) {
    setStatus('קוד חייב להיות 6 ספרות', 'err');
    return;
  }
  setStatus('מאמת…');
  try {
    const r = await fetch(`${API}/api/device/verify`, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({phone, device_id: deviceId, code}),
    });
    const data = await r.json();
    if (!r.ok) {
      setStatus('שגיאה: ' + (data.detail || r.statusText), 'err');
      return;
    }
    document.getElementById('out-uid').textContent = data.user_id;
    setStatus('מכשיר קושר! ממתין לפולינג של המכשיר…', 'ok');
    setStep('step-done');
  } catch (e) {
    setStatus('שגיאת רשת: ' + e.message, 'err');
  }
});
</script>
</body>
</html>
